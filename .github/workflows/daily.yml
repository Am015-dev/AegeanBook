name: Daily fares
on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC, 07:17 Athens
  workflow_dispatch:
permissions:
  contents: write
  issues: write  # the digest of changes is posted as an issue, so GitHub's own notifications can carry it
concurrency: daily
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flights==0.9.0 stays==0.1.1
      - id: run
        run: python collect_daily.py
        continue-on-error: true  # save what was collected even if some days are still missing
      - id: digest
        run: python digest.py
        continue-on-error: true  # a bonus: it must never stop the daily commit below
      - name: Commit results
        run: |
          git config user.name "daily-fares"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily.csv data/daily_hotel.csv data/history_prices.csv data/history_hotel.csv
          [ ! -f data/latest_changes.md ] || git add data/latest_changes.md  # only when the digest step wrote it: it must never block the data
          git diff --cached --quiet || git commit -m "Daily fares $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }} && git push
      - name: Price alerts
        continue-on-error: true  # comments on each open price-alert issue that today's fares meet; never blocks the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python alerts.py
      - name: Post what changed as an issue
        if: steps.digest.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Fare changes $(date -u +%F)" --body-file data/latest_changes.md
      - if: steps.run.outcome == 'failure'
        run: echo "Some days are still missing, see the collect step" && exit 1
