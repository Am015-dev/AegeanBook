name: CI
# Nothing broken reaches main: every pull request and every push to main runs the unit tests with only requirements.txt, like the
# deployed app (no browser, no network to AEGEAN or Google), and the browser smoke test (smoke_test.py) against the committed data.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # a new push cancels the run of the one before
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest playwright
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q -m smoke smoke_test.py
