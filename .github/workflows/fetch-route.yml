name: Fetch route
run-name: fetch ${{ inputs.request }}  # the app finds its run by this name
on:
  workflow_dispatch:
    inputs:
      legs:
        description: "orig,dest,start,end;... e.g. ATH,BIO,2026-11-01,2026-11-30;BIO,ATH,2026-11-03,2026-12-07"
        required: true
      nonstop:
        description: "1 for nonstop flights only"
        default: "1"
      request:
        description: "An id the app uses to find this run"
        required: true
      airline:
        description: "A3 for AEGEAN (both cabins, data/routes.csv) or GQ for Sky Express (economy only, data/skyexpress.csv)"
        default: "A3"
permissions:
  contents: write
jobs:
  plan:  # one job per leg below: each runs on its own GitHub server, so each has its own share of Google's rate limit
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.split.outputs.legs }}
    steps:
      - id: split
        env:
          LEGS: ${{ inputs.legs }}
        run: python3 -c 'import json, os; print("legs=" + json.dumps([l for l in os.environ["LEGS"].split(";") if l]))' >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flights==0.9.0
      - run: python fetch_route.py "$LEG" "$NONSTOP" "$RUNNER_TEMP/new_rows.csv"
        env:  # passed as variables, never pasted into the script, so the inputs cannot run commands
          LEG: ${{ matrix.leg }}
          NONSTOP: ${{ inputs.nonstop }}
          AIRLINE: ${{ inputs.airline }}
      - name: Commit results
        env:
          REQUEST: ${{ inputs.request }}
          AIRLINE: ${{ inputs.airline }}
        run: |
          git config user.name "fetch-route"
          git config user.email "actions@users.noreply.github.com"
          # The other legs' jobs, other fetches and the daily run save too: take the newest main every time, merge this job's rows into
          # it and push; never rebase a whole rewritten file (that conflicted and lost a fetch on 31 Oct).
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python fetch_route.py --merge "$RUNNER_TEMP/new_rows.csv"
            git add data/routes.csv data/tracked_routes.csv data/skyexpress.csv
            git diff --cached --quiet && exit 0
            git commit -q -m "Fetched $REQUEST"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          exit 1
